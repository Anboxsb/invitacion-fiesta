<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Fiesta! - Invitación</title>
  <!-- Fuentes elegantes y festivas -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <!-- Librería para el efecto de flores/confeti al abrir -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f4efe9;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    /* CONTENEDOR DE PÉTALOS CAYENDO CONSTANTEMENTE */
    #petals-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, #ffb7c5, #ff69b4);
      border-radius: 15px 0px 15px 0px;
      opacity: 0.8;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        top: -10%;
        transform: translateX(0) rotate(0deg);
        opacity: 0.9;
      }
      50% {
        transform: translateX(100px) rotate(180deg);
      }
      100% {
        top: 110%;
        transform: translateX(-50px) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* SOBRE (ESTADO INICIAL) */
    .envelope-container {
      cursor: pointer;
      text-align: center;
      transition: transform 0.3s ease;
      z-index: 10;
    }
    .envelope-container:hover {
      transform: scale(1.03);
    }
    .envelope {
      width: 290px;
      height: 200px;
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #b89228);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      position: relative;
      border: 2px solid #b89228;
    }
    .envelope h1 {
      font-family: 'Playfair Display', serif;
      color: #ffffff;
      font-size: 2.2rem;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
    }
    .envelope .music-notes {
      font-size: 1.8rem;
    }
    .tap-hint {
      margin-top: 18px;
      color: #555;
      font-size: 0.95rem;
      font-weight: 600;
      animation: pulse 1.5s infinite;
    }

    /* CONTROLES DE MÚSICA */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 50px;
      padding: 10px 18px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
    }

    /* TARJETA DE INVITACIÓN */
    .card {
      display: none;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(5px);
      max-width: 460px;
      width: 100%;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: center;
      border: 1px solid #f0e6d2;
      animation: fadeIn 1s ease forwards;
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      color: #2c3e50;
      font-size: 1.35rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .card .subtitle {
      color: #d4af37;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-group {
      margin: 16px 0;
      border-bottom: 1px dashed #e0e0e0;
      padding-bottom: 10px;
    }
    .info-group:last-of-type {
      border-bottom: none;
    }
    .label {
      font-weight: 700;
      color: #d4af37;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 3px;
    }
    .value {
      color: #333;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .sub-value {
      color: #666;
      font-size: 0.95rem;
    }

    /* BOTÓN DE CONFIRMACIÓN */
    .btn-confirm {
      display: inline-block;
      margin-top: 15px;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
      transition: all 0.3s ease;
    }
    .btn-confirm:hover {
      background: #1eb857;
      transform: translateY(-2px);
    }

    /* ANIMACIONES */
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.6; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR DE PÉTALOS -->
  <div id="petals-container"></div>

  <!-- AUDIO DE FONDO ("Flowers" de Miley Cyrus) -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://ia801602.us.archive.org/11/items/miley-cyrus-flowers/Miley%20Cyrus%20-%20Flowers.mp3" type="audio/mpeg">
  </audio>

  <!-- BOTÓN DE MÚSICA REPRODUCIR / PAUSAR -->
  <div class="music-control" id="music-btn" onclick="toggleMusic()">
    <span id="music-icon">🎵</span>
    <span id="music-text">Música: On</span>
  </div>

  <!-- SOBRE CERRADO -->
  <div class="envelope-container" id="envelope" onclick="openEnvelope()">
    <div class="envelope">
      <h1>FIESTA!</h1>
      <div class="music-notes">🎵🎶🎼</div>
    </div>
    <p class="tap-hint">Toca el sobre para abrir ✉️</p>
  </div>

  <!-- TARJETA DESPLEGADA -->
  <div class="card" id="card">
    <h2>Los invitamos a festejar nuestro cambio de década (60 y 70)</h2>
    <div class="subtitle">Y nuestro Aniversario N° 10</div>

    <div class="info-group">
      <span class="label">¿Cuándo?</span>
      <span class="value">25 / 09 / 2026</span>
    </div>

    <div class="info-group">
      <span class="label">¿Hora?</span>
      <span class="value">21:00 hs</span>
    </div>

    <div class="info-group">
      <span class="label">¿Dónde?</span>
      <span class="value">AVA</span>
      <div class="sub-value">Rambla Wilson 2180</div>
    </div>

    <div class="info-group">
      <span class="label">Vestimenta</span>
      <span class="value">Sport Elegante</span>
    </div>

    <!-- Modifica el enlace de WhatsApp con el número correspondiente -->
    <a href="https://wa.me/59899000000?text=¡Hola!%20Confirmo%20mi%20asistencia%20a%20la%20fiesta." class="btn-confirm" target="_blank">
      Confirmar Asistencia 📲
    </a>
  </div>

  <script>
    // CREACIÓN CONSTANTE DE PÉTALOS ROSAS CAYENDO
    function createPetals() {
      const container = document.getElementById('petals-container');
      const petalCount = 25; // Cantidad de pétalos simultáneos

      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('div');
        petal.classList.add('petal');
        
        // Tamaños variados
        const size = Math.random() * 12 + 10;
        petal.style.width = `${size}px`;
        petal.style.height = `${size * 1.4}px`;
        
        // Posición horizontal aleatoria
        petal.style.left = `${Math.random() * 100}%`;
        
        // Duración y retraso de animación aleatorios
        const duration = Math.random() * 5 + 5;
        const delay = Math.random() * 5;
        petal.style.animationDuration = `${duration}s`;
        petal.style.animationDelay = `${delay}s`;
        
        // Tonalidades de rosa variadas
        const pinkShades = [
          'radial-gradient(circle at 30% 30%, #ffc0cb, #ff69b4)',
          'radial-gradient(circle at 30% 30%, #ffb6c1, #db7093)',
          'radial-gradient(circle at 30% 30%, #ffe4e1, #ff1493)'
        ];
        petal.style.background = pinkShades[Math.floor(Math.random() * pinkShades.length)];

        container.appendChild(petal);
      }
    }

    // ABRIR SOBRE, INICIAR MÚSICA Y EXPLOSIÓN INICIAL DE FLORES
    function openEnvelope() {
      // Ocultar sobre y mostrar tarjeta
      document.getElementById('envelope').style.display = 'none';
      document.getElementById('card').style.display = 'block';

      // Mostrar control flotante de música
      document.getElementById('music-btn').style.display = 'flex';

      // Reproducir canción "Flowers"
      const audio = document.getElementById('bg-music');
      audio.play().catch(error => {
        console.log("Autoplay bloqueado por el navegador:", error);
      });

      // Explosión inicial de flores/confeti
      var scalar = 2.2;
      var flower = confetti.shapeFromText({ text: '🌸', scalar });
      var rose = confetti.shapeFromText({ text: '🌹', scalar });
      var leaf = confetti.shapeFromText({ text: '🍃', scalar });
      var sparkles = confetti.shapeFromText({ text: '✨', scalar });

      confetti({
        shapes: [flower, rose, leaf, sparkles],
        scalar: scalar,
        particleCount: 50,
        spread: 120,
        origin: { y: 0.6 }
      });
    }

    // CONTROL DE ACTIVAR / PAUSAR MÚSICA
    function toggleMusic() {
      const audio = document.getElementById('bg-music');
      const text = document.getElementById('music-text');
      const icon = document.getElementById('music-icon');

      if (audio.paused) {
        audio.play();
        text.innerText = 'Música: On';
        icon.innerText = '🎵';
      } else {
        audio.pause();
        text.innerText = 'Música: Off';
        icon.innerText = '🔇';
      }
    }

    // Iniciar lluvia de pétalos al cargar la página
    window.onload = createPetals;
  </script>
</body>
</html>
